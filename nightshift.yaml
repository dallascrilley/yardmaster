logging:
  level: info
  path: .nightshift/logs
  format: json

budget:
  db_path: .nightshift/nightshift.db

tasks:
  enabled:
    - lint-fix
    - backward-compat
    - docs-backfill
  priorities:
    lint-fix: 1
    backward-compat: 1
    docs-backfill: 2
  intervals:
    lint-fix: "72h"
    backward-compat: "168h"
    docs-backfill: "168h"

integrations:
  claude_md: true
  agents_md: true
  task_sources:
    - td:
        enabled: true
        teach_agent: true
