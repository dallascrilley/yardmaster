name: Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Fail here, with an actionable message, rather than inside Vitest's
      # globalSetup — where the reported code frame points at the wrong source
      # line and reads like a TypeScript parse error.
      - name: Check required secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::The GEMINI_API_KEY repository secret is not set. The smoke suite drives the real Gemini CLI, so it cannot run without it. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # `yardmaster providers doctor` probes gemini with `gemini --version`, so
      # the CLI has to exist on PATH before global setup runs. Intentionally
      # unpinned: this daily job is a canary for upstream provider drift.
      - name: Install Gemini CLI
        run: |
          npm install -g @google/gemini-cli
          gemini --version

      # Only gemini can authenticate from a secret; claude, codex, and
      # cursor-agent need interactive OAuth and are never available here.
      # GEMINI_CLI_TRUST_WORKSPACE is required because the CLI refuses to run
      # in an untrusted directory, which every fresh runner checkout is.
      - name: Run smoke tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        run: bun run test:smoke:preflight
