name: Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  CODEX_HOME: ${{ github.workspace }}/.codex-ci

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Fail here, with an actionable message, rather than inside Vitest's
      # globalSetup — where the reported code frame points at the wrong source
      # line and reads like a TypeScript parse error.
      - name: Check required secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::The OPENROUTER_API_KEY repository secret is not set. The smoke suite drives the real Codex CLI against OpenRouter, so it cannot run without it. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Two binaries, two jobs. `codex` is what `yardmaster providers doctor`
      # probes for availability (`codex --version`) and auth (`codex login
      # status`); `codex-acp` is the ACP agent yardmaster actually spawns, and
      # it must be on PATH so the provider registry resolves it without falling
      # back to `npx`, which blocks on an install prompt in CI. Both are
      # intentionally unpinned: this daily job is a canary for upstream
      # provider drift.
      - name: Install Codex CLI and ACP agent
        run: |
          npm install -g @openai/codex @zed-industries/codex-acp
          codex --version
          command -v codex-acp

      # Codex authenticates against OpenRouter from an environment variable
      # instead of an interactive ChatGPT login, which is the only way any
      # provider can authenticate on a fresh runner. `wire_api = "responses"`
      # is required: current codex rejects the older "chat" value outright, and
      # OpenRouter serves the Responses API. `codex login status` still reports
      # "Not logged in" for this setup, so `providers doctor` reads this file to
      # confirm the configured `env_key` is populated.
      - name: Configure Codex for OpenRouter
        run: |
          mkdir -p "${CODEX_HOME}"
          cat > "${CODEX_HOME}/config.toml" <<'TOML'
          model = "google/gemini-3-flash-preview"
          model_provider = "openrouter"

          [model_providers.openrouter]
          name = "OpenRouter"
          base_url = "https://openrouter.ai/api/v1"
          env_key = "OPENROUTER_API_KEY"
          wire_api = "responses"
          TOML
          cat "${CODEX_HOME}/config.toml"

      # codex-only. claude, gemini, and cursor-agent are not installed here:
      # claude and cursor-agent need interactive OAuth, and gemini would need a
      # second provider secret for no extra signal.
      - name: Run smoke tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run test:smoke:preflight
