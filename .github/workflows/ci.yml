name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genie
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Link installed binary
        run: bun link

      - name: Verify linked binary help and JSON provider inventory
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          genie --help >/tmp/genie-help.txt
          grep -q "Unified AI CLI" /tmp/genie-help.txt
          genie providers list --json >/tmp/genie-providers.json
          bun -e 'const parsed = JSON.parse(await Bun.file("/tmp/genie-providers.json").text()); if (parsed.kind !== "providers_list" || parsed.ok !== true) throw new Error("unexpected providers list envelope");'

      - name: Verify linked binary plain execution with mocked provider
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          MOCK_BIN_DIR="$(mktemp -d)"
          cat <<'EOF' >"$MOCK_BIN_DIR/claude"
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "claude 1.0.0"
            exit 0
          fi
          if [ "$1" = "auth" ] && [ "$2" = "status" ]; then
            echo "authenticated"
            exit 0
          fi
          echo "mocked response"
          EOF
          chmod +x "$MOCK_BIN_DIR/claude"
          PATH="$MOCK_BIN_DIR:$PATH" genie run --provider claude --no-fallback --plain "hello" >/tmp/genie-run.txt
          test "$(cat /tmp/genie-run.txt)" = "mocked response"

      - name: Verify installed-binary exit code contract
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"

          genie run --unknown-flag bad >/tmp/genie-usage.out 2>/tmp/genie-usage.err || usage_status=$?
          : "${usage_status:=0}"
          test "$usage_status" -eq 2

          AUTH_BIN_DIR="$(mktemp -d)"
          cat <<'EOF' >"$AUTH_BIN_DIR/claude"
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "claude 1.0.0"
            exit 0
          fi
          if [ "$1" = "auth" ] && [ "$2" = "status" ]; then
            echo "login required" >&2
            exit 1
          fi
          echo "should not execute" >&2
          exit 1
          EOF
          chmod +x "$AUTH_BIN_DIR/claude"
          PATH="$AUTH_BIN_DIR:$PATH" genie run --provider claude --no-fallback "hello" >/tmp/genie-auth.out 2>/tmp/genie-auth.err || auth_status=$?
          : "${auth_status:=0}"
          test "$auth_status" -eq 3

          TIMEOUT_BIN_DIR="$(mktemp -d)"
          cat <<'EOF' >"$TIMEOUT_BIN_DIR/claude"
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "claude 1.0.0"
            exit 0
          fi
          if [ "$1" = "auth" ] && [ "$2" = "status" ]; then
            echo "authenticated"
            exit 0
          fi
          sleep 1
          echo "too late"
          EOF
          chmod +x "$TIMEOUT_BIN_DIR/claude"
          PATH="$TIMEOUT_BIN_DIR:$PATH" genie run --provider claude --no-fallback --timeout-ms 1 "hello" >/tmp/genie-timeout.out 2>/tmp/genie-timeout.err || timeout_status=$?
          : "${timeout_status:=0}"
          test "$timeout_status" -eq 124
